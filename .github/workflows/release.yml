# v로 시작하는 태그(예: v0.2.0)를 올리면 윈도우 설치 파일을 만들어 GitHub 릴리스에 올린다.
# 프로그램은 이 릴리스를 보고 업데이트를 받고, 홈페이지는 여기서 설치 파일을 내려받는다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그와 package.json 버전이 다르면 업데이트가 꼬이므로 막는다.
      - name: Check version matches tag
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "package.json 버전($pkg)과 태그($GITHUB_REF_NAME)가 달라요." >&2
            exit 1
          fi

      # 일정 테스트는 한국 시간을 기준으로 짜여 있다. (러너 기본값은 UTC)
      - name: Use Korea time zone
        run: tzutil /s "Korea Standard Time"

      - run: npm test

      # 업로드 도중 실패해도 다음 단계에서 다시 올려 본다. 성공 여부는 다음 단계가 정한다.
      - run: npm run release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder가 큰 설치 파일 업로드를 조용히 빠뜨린 적이 있어(v0.1.3, v0.1.5),
      # 만든 파일을 모두 다시 올리고(같은 이름은 덮어씀) 하나라도 없으면 실패로 끝낸다.
      - name: Make sure every file is on the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/ClassroomClock-Setup.exe dist/ClassroomClock-Setup.exe.blockmap dist/ClassroomClock-portable.exe dist/latest.yml"
          for f in $files; do test -f "$f" || { echo "만들어지지 않은 파일: $f" >&2; exit 1; }; done
          gh release upload "$GITHUB_REF_NAME" $files --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for f in $files; do
            name=$(basename "$f")
            echo "$uploaded" | grep -qx "$name" || { echo "릴리스에 없는 파일: $name" >&2; exit 1; }
          done
          echo "릴리스 파일 확인 완료"

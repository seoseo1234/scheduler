# v로 시작하는 태그(예: v0.2.0)를 올리면 윈도우 설치 파일을 만들어 GitHub 릴리스에 올린다.
# 프로그램은 이 릴리스를 보고 업데이트를 받고, 홈페이지는 여기서 설치 파일을 내려받는다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그와 package.json 버전이 다르면 업데이트가 꼬이므로 막는다.
      - name: Check version matches tag
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "package.json 버전($pkg)과 태그($GITHUB_REF_NAME)가 달라요." >&2
            exit 1
          fi

      # 일정 테스트는 한국 시간을 기준으로 짜여 있다. (러너 기본값은 UTC)
      - name: Use Korea time zone
        run: tzutil /s "Korea Standard Time"

      - run: npm test

      # electron-builder의 자체 업로드가 큰 설치 파일이나 latest.yml을 빠뜨리는 일이
      # 여러 번 있어서(v0.1.3, v0.1.5, v0.1.6), 빌드만 하고 업로드는 gh로 한다.
      # publish 설정이 있으면 --publish never여도 dist/latest.yml(자동 업데이트 정보)은 만들어진다.
      - name: Build installers
        run: npx electron-vite build && npx electron-builder --win nsis portable --publish never

      - name: Upload to the release and check every file
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/ClassroomClock-Setup.exe dist/ClassroomClock-Setup.exe.blockmap dist/ClassroomClock-portable.exe dist/latest.yml"
          for f in $files; do test -f "$f" || { echo "만들어지지 않은 파일: $f" >&2; ls dist >&2; exit 1; }; done
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "${tag#v}" --notes "우리반 시계 ${tag}"
          # 큰 파일은 가끔 끊기므로 세 번까지 다시 올린다 (같은 이름은 덮어씀).
          for attempt in 1 2 3; do
            gh release upload "$tag" $files --clobber && break
            echo "업로드 실패, 다시 시도 ($attempt)" >&2; sleep 10
          done
          gh release edit "$tag" --draft=false --latest
          uploaded=$(gh release view "$tag" --json assets --jq ".assets[].name")
          for f in $files; do
            name=$(basename "$f")
            echo "$uploaded" | grep -qx "$name" || { echo "릴리스에 없는 파일: $name" >&2; exit 1; }
          done
          echo "릴리스 파일 확인 완료"

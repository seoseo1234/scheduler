# v로 시작하는 태그(예: v0.2.0)를 올리면 윈도우 설치 파일을 만들어 GitHub 릴리스에 올린다.
# 프로그램은 이 릴리스를 보고 업데이트를 받고, 홈페이지는 여기서 설치 파일을 내려받는다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그와 package.json 버전이 다르면 업데이트가 꼬이므로 막는다.
      - name: Check version matches tag
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "package.json 버전($pkg)과 태그($GITHUB_REF_NAME)가 달라요." >&2
            exit 1
          fi

      - run: npm test

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
